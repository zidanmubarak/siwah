<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="siwah-preview-title siwah-preview-desc">
  <title id="siwah-preview-title">siwah terminal interface</title>
  <desc id="siwah-preview-desc">A stylized terminal window showing session tabs, a tool card, a diff, and the siwah prompt box.</desc>
  <defs>
    <clipPath id="window">
      <rect x="40" y="40" width="1120" height="620" rx="14"/>
    </clipPath>
    <style>
      .ui { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .muted { fill: #9CAAC0; }
      .dim { fill: #73839C; }
      .gold { fill: #d4a63a; }
      .text { fill: #d7dae0; }
      .green { fill: #8ED3A0; }
      .red { fill: #F07C86; }
    </style>
  </defs>

  <rect width="1200" height="700" fill="#0f0f14"/>
  <g clip-path="url(#window)">
    <rect x="40" y="40" width="1120" height="620" fill="#15151b"/>

    <!-- top bar -->
    <rect x="40" y="40" width="1120" height="46" fill="#151B24"/>
    <circle cx="66" cy="63" r="6" fill="#c2324f"/>
    <circle cx="88" cy="63" r="6" fill="#d4a63a"/>
    <circle cx="110" cy="63" r="6" fill="#8ED3A0"/>

    <rect x="150" y="48" width="112" height="30" rx="6" fill="#1C2532"/>
    <text x="168" y="68" class="ui text" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#d7dae0">siwah</text>
    <rect x="150" y="76" width="112" height="3" fill="#d4a63a"/>
    <text x="282" y="68" class="ui dim" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#73839C">tests</text>
    <text x="350" y="68" class="ui dim" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#73839C">+</text>

    <text x="1060" y="68" class="ui dim" font-size="14" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#73839C">main</text>
    <line x1="40" y1="86" x2="1160" y2="86" stroke="#2D3A4B" stroke-width="1"/>

    <!-- transcript: tool card -->
    <rect x="120" y="118" width="960" height="86" rx="8" fill="#151B24" stroke="#2D3A4B" stroke-width="1"/>
    <text x="140" y="145" class="ui gold" font-size="16" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#d4a63a">read_file</text>
    <text x="236" y="145" class="ui dim" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#73839C">src/math_utils.py</text>
    <text x="1080" y="145" class="ui green" font-size="14" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8ED3A0">ok 12ms</text>
    <text x="140" y="171" class="ui muted" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#9CAAC0">1  def add(a, b):</text>
    <text x="140" y="191" class="ui muted" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#9CAAC0">2      return a - b</text>

    <!-- transcript: diff card -->
    <rect x="120" y="220" width="960" height="104" rx="8" fill="#151B24" stroke="#2D3A4B" stroke-width="1"/>
    <text x="140" y="247" class="ui gold" font-size="16" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#d4a63a">edit_file</text>
    <text x="230" y="247" class="ui dim" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#73839C">src/math_utils.py</text>
    <text x="1080" y="247" class="ui green" font-size="14" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8ED3A0">applied</text>
    <rect x="132" y="258" width="936" height="24" fill="#352029"/>
    <text x="142" y="275" class="ui red" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#F07C86">- 2      return a - b</text>
    <rect x="132" y="286" width="936" height="24" fill="#1d3329"/>
    <text x="142" y="303" class="ui green" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8ED3A0">+ 2      return a + b</text>

    <!-- welcome -->
    <text x="600" y="392" class="ui gold" font-size="34" font-weight="bold" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#d4a63a">siwah</text>
    <text x="600" y="424" class="ui muted" font-size="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#9CAAC0">Build something. Understand anything.</text>
    <text x="600" y="452" class="ui dim" font-size="14" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#73839C">/sessions resume    /help explore</text>

    <!-- prompt box -->
    <rect x="90" y="500" width="1020" height="92" rx="10" fill="#151B24" stroke="#d4a63a" stroke-width="2"/>
    <text x="114" y="532" class="ui gold" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#d4a63a">›</text>
    <text x="138" y="532" class="ui text" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#d7dae0">fix the failing test and explain the change</text>
    <text x="114" y="566" class="ui dim" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#73839C">enter send   shift+enter newline   / commands   @ files   ! shell</text>
    <text x="1084" y="566" class="ui dim" font-size="13" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#73839C">ask</text>

    <!-- status bar -->
    <rect x="40" y="620" width="1120" height="40" fill="#151B24"/>
    <line x1="40" y1="620" x2="1160" y2="620" stroke="#2D3A4B" stroke-width="1"/>
    <text x="66" y="645" class="ui muted" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#9CAAC0">main · build</text>
    <text x="210" y="645" class="ui dim" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#73839C">ctx 12.4k/128k 10%</text>
    <text x="420" y="645" class="ui dim" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#73839C">tasks 2/4</text>
    <text x="1084" y="645" class="ui dim" font-size="13" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#73839C">siwah 1.0.0</text>
  </g>
  <rect x="40" y="40" width="1120" height="620" rx="14" fill="none" stroke="#2D3A4B" stroke-width="1"/>
</svg>
