name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install Python dependencies
        run: uv sync --extra dev

      - name: Install TUI dependencies
        run: bun install --frozen-lockfile

      - name: Build wheel and TUI binary
        run: uv run python scripts/build-release.py

      - name: Include bootstrap installers
        shell: bash
        run: |
          mkdir -p dist
          cp scripts/install/bootstrap.ps1 scripts/install/bootstrap.sh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        run: |
          cd dist
          # Each matrix job uploads its own SHA256SUMS; remove the merged copy
          # first so the glob cannot hash the file it is about to replace.
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "siwah ${GITHUB_REF_NAME#v}" \
            --notes-file CHANGELOG.md
