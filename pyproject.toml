[project]
name = "siwah"
version = "1.0.4"
description = "Self-improving coding agent harness CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "filelock>=3.16.1",
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
  "pyjwt[crypto]>=2.10.1",
  "rich>=13.9.0",
  "tomli-w>=1.0.0",
  "tree-sitter>=0.25.0",
  "tree-sitter-javascript>=0.23.0",
  "tree-sitter-python>=0.23.0",
  "tree-sitter-typescript>=0.23.0",
  "typer>=0.15.0",
  "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pyright>=1.1.390",
  "ruff>=0.8.0",
]
lsp = [
  "nodejs-wheel>=24.0.0",
]

[project.scripts]
siwah = "siwah.cli.main:app"

[project.urls]
Homepage = "https://github.com/zidanmubarak/siwah"
Repository = "https://github.com/zidanmubarak/siwah"
Issues = "https://github.com/zidanmubarak/siwah/issues"
Changelog = "https://github.com/zidanmubarak/siwah/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/siwah"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["spikes", ".refs", ".tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pygate.policy]
# The full pytest suite is ~3 minutes on Windows; the default 120s cap is
# shorter than the suite, not a failing check.
command_timeout_seconds = 300

[tool.pygate.commands]
# Keep PyGate's typecheck identical to CI and to [tool.pyright].include.
# scripts/tui-matrix uses optional deps (pyte/pywinpty) installed ad hoc by the
# runbook, so a repo-wide pyright run is not the project's contract.
typecheck = "pyright --outputjson"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedVariable = true
